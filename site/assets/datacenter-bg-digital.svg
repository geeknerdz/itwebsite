<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" role="img" aria-label="Dark digital datacenter background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030507"/>
      <stop offset="55%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#020304"/>
    </linearGradient>

    <radialGradient id="glowTopRight" cx="78%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#4d8dff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#193563" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCenter" cx="52%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#8cb7ff" stop-opacity="0.11"/>
      <stop offset="50%" stop-color="#2a4f88" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rackFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="35%" stop-color="#101722"/>
      <stop offset="50%" stop-color="#151d29"/>
      <stop offset="100%" stop-color="#080d14"/>
    </linearGradient>

    <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1723" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1a2e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4d8dff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1a2e" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.18  0 1 0 0 0.42  0 0 1 0 0.95  0 0 0 0.9 0" result="blueGlow"/>
      <feMerge>
        <feMergeNode in="blueGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 H 0 V 120" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
      <path d="M 60 0 V 120 M 0 60 H 120" fill="none" stroke="#4d8dff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <pattern id="microDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="2400" height="1600" fill="url(#bg)"/>
  <rect width="2400" height="1600" fill="url(#glowTopRight)"/>
  <rect width="2400" height="1600" fill="url(#glowCenter)"/>
  <rect width="2400" height="1600" fill="url(#grid)" opacity="0.45"/>
  <rect width="2400" height="1600" fill="url(#microDots)" opacity="0.32"/>

  <!-- Ambient diagonal streaks -->
  <g opacity="0.35">
    <path d="M 180 280 C 560 150, 810 260, 1130 190 S 1790 95, 2240 250" fill="none" stroke="url(#blueLine)" stroke-width="4" opacity="0.5"/>
    <path d="M 120 520 C 470 390, 790 540, 1100 470 S 1820 340, 2300 510" fill="none" stroke="url(#blueLine)" stroke-width="3" opacity="0.35"/>
    <path d="M 260 1020 C 640 880, 940 1040, 1260 960 S 1870 820, 2140 910" fill="none" stroke="url(#blueLine)" stroke-width="3" opacity="0.25"/>
  </g>

  <!-- Floating HUD panels -->
  <g filter="url(#softGlow)">
    <rect x="1030" y="260" width="300" height="170" rx="24" fill="url(#glassPanel)" stroke="#4d8dff" stroke-opacity="0.24"/>
    <rect x="1080" y="315" width="190" height="10" rx="5" fill="#4d8dff" fill-opacity="0.42"/>
    <rect x="1080" y="345" width="240" height="8" rx="4" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="1080" y="369" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="1284" cy="346" r="28" fill="none" stroke="#4d8dff" stroke-opacity="0.65" stroke-width="4"/>
    <circle cx="1284" cy="346" r="14" fill="#4d8dff" fill-opacity="0.72"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.95">
    <rect x="1440" y="150" width="180" height="90" rx="18" fill="url(#glassPanel)" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="1462" y="178" width="104" height="8" rx="4" fill="#4d8dff" fill-opacity="0.5"/>
    <rect x="1462" y="198" width="130" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- Server rack silhouette across the lower third -->
  <g transform="translate(0, 840)">
    <ellipse cx="1200" cy="520" rx="920" ry="150" fill="#000000" fill-opacity="0.42"/>

    <g transform="translate(190, 100)">
      <rect x="0" y="50" width="390" height="420" rx="24" fill="url(#rackFace)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="28" y="78" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="118" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="158" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="198" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="238" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="278" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="318" width="334" height="26" rx="9" fill="#121a25"/>
      <rect x="28" y="358" width="334" height="26" rx="9" fill="#121a25"/>
      <g filter="url(#softGlow)">
        <circle cx="58" cy="91" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="131" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="171" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="211" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="251" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="291" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="331" r="4" fill="#4d8dff"/>
        <circle cx="58" cy="371" r="4" fill="#4d8dff"/>
        <rect x="98" y="86" width="120" height="6" rx="3" fill="#4d8dff" fill-opacity="0.7"/>
        <rect x="98" y="126" width="150" height="6" rx="3" fill="#4d8dff" fill-opacity="0.45"/>
        <rect x="98" y="166" width="90" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="98" y="206" width="140" height="6" rx="3" fill="#4d8dff" fill-opacity="0.32"/>
        <rect x="98" y="246" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
        <rect x="98" y="286" width="160" height="6" rx="3" fill="#4d8dff" fill-opacity="0.26"/>
        <rect x="98" y="326" width="100" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
        <rect x="98" y="366" width="132" height="6" rx="3" fill="#4d8dff" fill-opacity="0.26"/>
      </g>
    </g>

    <g transform="translate(1740, 120)">
      <rect x="0" y="0" width="440" height="500" rx="24" fill="url(#rackFace)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="28" y="34" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="66" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="98" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="130" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="162" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="194" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="226" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="258" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="290" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="322" width="384" height="20" rx="8" fill="#111822"/>
      <rect x="28" y="354" width="384" height="20" rx="8" fill="#111822"/>
      <g filter="url(#softGlow)">
        <circle cx="394" cy="44" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="76" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="108" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="140" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="172" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="204" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="236" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="268" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="300" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="332" r="4" fill="#4d8dff"/>
        <circle cx="394" cy="364" r="4" fill="#4d8dff"/>
      </g>
    </g>
  </g>

  <!-- Network topology ribbons -->
  <g filter="url(#softGlow)" opacity="0.95">
    <path d="M 520 330 C 760 210, 920 190, 1130 250 S 1540 410, 1780 240" fill="none" stroke="#4d8dff" stroke-opacity="0.34" stroke-width="3.5"/>
    <path d="M 440 760 C 700 660, 960 670, 1160 720 S 1560 860, 1900 710" fill="none" stroke="#4d8dff" stroke-opacity="0.26" stroke-width="3"/>
    <path d="M 820 1080 C 1070 930, 1320 910, 1530 980 S 1900 1130, 2120 980" fill="none" stroke="#4d8dff" stroke-opacity="0.22" stroke-width="3"/>
    <circle cx="520" cy="330" r="8" fill="#4d8dff" fill-opacity="0.75"/>
    <circle cx="1130" cy="250" r="10" fill="#4d8dff" fill-opacity="0.88"/>
    <circle cx="1780" cy="240" r="8" fill="#4d8dff" fill-opacity="0.72"/>
    <circle cx="1160" cy="720" r="9" fill="#4d8dff" fill-opacity="0.78"/>
    <circle cx="1530" cy="980" r="8" fill="#4d8dff" fill-opacity="0.7"/>
  </g>

  <!-- Subtle vignette -->
  <rect width="2400" height="1600" fill="#000000" fill-opacity="0.12"/>
</svg>
